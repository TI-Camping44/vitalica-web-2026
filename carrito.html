<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tu carrito · Vitalica</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,400..900&family=Inter:wght@400;500;600;700&family=Montserrat:wght@700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="assets/css/styles.css?v=55">

  <!-- PROPUESTA DE REDISEÑO (estilo BPN). Inerte hasta que tema.js pone
       data-tema="2026" en el <html>. Ver assets/css/tema-2026.css -->
  <link rel="stylesheet" href="assets/css/tema-2026.css?v=55">
  <script src="assets/js/tema.js?v=55"></script>
</head>
<body>

  <!-- Pantalla de carga: tapa el instante en que el JS todavia no armo
       el header ni el contenido. La quita main.js; si el JS fallara, la
       animacion de seguridad de styles.css la desvanece igual. -->
  <div class="cargando" data-cargando aria-hidden="true">
    <p class="cargando__marca">VITA<span>LICA</span></p>
    <p class="cargando__sub">Olimp Sport Nutrition</p>
    <div class="cargando__barra"><span class="cargando__relleno" data-relleno></span></div>
    <p class="cargando__pct" data-pct>0%</p>
  </div>


  <div id="chrome-top"></div>

  <main>
    <section class="pagina-cabecera">
      <div class="contenedor">
        <p class="eyebrow">Carrito</p>
        <h1>Tu carrito</h1>
      </div>
    </section>

    <section class="seccion">
      <!-- carrito.js arma la vista (vacío o con productos) -->
      <div class="contenedor" data-carrito-vista></div>
    </section>
  </main>

  <div id="chrome-bottom"></div>

  <!-- Precios de Odoo: los genera sync-odoo-precios.py. Va ANTES de data.js. -->
  <script src="assets/js/precios.js?v=55"></script>
  <script src="assets/js/data.js?v=55"></script>
  <script src="assets/js/analitica.js?v=55"></script>
  <script src="assets/js/cart.js?v=55"></script>
  <script src="assets/js/components.js?v=55"></script>
  <script src="assets/js/main.js?v=55"></script>
  <script src="assets/js/pages/carrito.js?v=55"></script>

</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Armá tu pedido · Vitalica</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,400..900&family=Inter:wght@400;500;600;700&family=Montserrat:wght@700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="assets/css/styles.css?v=58">

  <!-- PROPUESTA DE REDISEÑO (estilo BPN). Inerte hasta que tema.js pone
       data-tema="2026" en el <html>. Ver assets/css/tema-2026.css -->
  <link rel="stylesheet" href="assets/css/tema-2026.css?v=58">
  <script src="assets/js/tema.js?v=58"></script>
  <!-- COMPARTIR: lo que se ve al pegar el enlace en WhatsApp. -->
  <link rel="canonical" href="https://vitalica.com.py/checkout.html">
  <meta name="robots" content="noindex, follow">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Vitalica">
  <meta property="og:locale" content="es_PY">
  <meta property="og:title" content="Armá tu pedido · Vitalica">
  <meta property="og:description" content="Completá tus datos y te abrimos WhatsApp con el pedido listo.">
  <meta property="og:url" content="https://vitalica.com.py/checkout.html">
  <meta property="og:image" content="https://vitalica.com.py/assets/img/og-portada.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Vitalica · representante exclusivo de Olimp Sport Nutrition en Paraguay">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Armá tu pedido · Vitalica">
  <meta name="twitter:description" content="Completá tus datos y te abrimos WhatsApp con el pedido listo.">
  <meta name="twitter:image" content="https://vitalica.com.py/assets/img/og-portada.jpg">
  <!-- /COMPARTIR -->
</head>
<body>

  <!-- Pantalla de carga: tapa el instante en que el JS todavia no armo
       el header ni el contenido. La quita main.js; si el JS fallara, la
       animacion de seguridad de styles.css la desvanece igual. -->
  <div class="cargando" data-cargando aria-hidden="true">
    <p class="cargando__marca">VITA<span>LICA</span></p>
    <p class="cargando__sub">Olimp Sport Nutrition</p>
    <div class="cargando__barra"><span class="cargando__relleno" data-relleno></span></div>
    <p class="cargando__pct" data-pct>0%</p>
  </div>


  <div id="chrome-top"></div>

  <main>
    <section class="pagina-cabecera">
      <div class="contenedor">
        <p class="eyebrow">Último paso</p>
        <h1>Armá tu pedido</h1>
      </div>
    </section>

    <section class="seccion">
      <!-- checkout.js arma el formulario, el resumen y la confirmación -->
      <div class="contenedor" data-checkout></div>
    </section>
  </main>

  <div id="chrome-bottom"></div>

  <!-- Precios de Odoo: los genera sync-odoo-precios.py. Va ANTES de data.js. -->
  <script src="assets/js/precios.js?v=58"></script>
  <script src="assets/js/data.js?v=58"></script>
  <script src="assets/js/analitica.js?v=58"></script>
  <script src="assets/js/cart.js?v=58"></script>
  <script src="assets/js/components.js?v=58"></script>
  <script src="assets/js/main.js?v=58"></script>
  <!-- Arma el PDF del pedido en el navegador. Solo lo necesita el checkout. -->
  <script src="assets/js/pdf-pedido.js?v=58"></script>
  <script src="assets/js/pages/checkout.js?v=58"></script>

</body>
</html>

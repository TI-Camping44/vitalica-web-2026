<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Productos · Vitalica — Olimp Sport Nutrition</title>
  <meta name="description" content="Todos los productos de Olimp en Vitalica: proteínas, creatina, pre-entrenos, vitaminas, omega 3 y más.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,400..900&family=Inter:wght@400;500;600;700&family=Montserrat:wght@700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="assets/css/styles.css?v=47">

  <!-- PROPUESTA DE REDISEÑO (estilo BPN). Inerte hasta que tema.js pone
       data-tema="2026" en el <html>. Ver assets/css/tema-2026.css -->
  <link rel="stylesheet" href="assets/css/tema-2026.css?v=47">
  <script src="assets/js/tema.js?v=47"></script>
</head>
<body>

  <!-- Pantalla de carga: tapa el instante en que el JS todavia no armo
       el header ni el contenido. La quita main.js; si el JS fallara, la
       animacion de seguridad de styles.css la desvanece igual. -->
  <div class="cargando" data-cargando aria-hidden="true">
    <p class="cargando__marca">VITA<span>LICA</span></p>
    <p class="cargando__sub">Olimp Sport Nutrition</p>
    <div class="cargando__barra"><span class="cargando__relleno" data-relleno></span></div>
    <p class="cargando__pct" data-pct>0%</p>
  </div>


  <div id="chrome-top"></div>

  <main>
    <section class="pagina-cabecera">
      <div class="contenedor">
        <p class="eyebrow">Productos</p>
        <h1>Nuestros productos</h1>
        <p>Productos 100% originales de Olimp Sport Nutrition. Filtrá por objetivo si querés.</p>
        <nav class="cat-nav" data-filtro-metas aria-label="Filtrar por objetivo"></nav>
      </div>
    </section>

    <section class="seccion">
      <div class="contenedor catalogo">

        <!-- Panel de filtros. Lo llena assets/js/pages/productos.js y en el
             diseño actual no se muestra: ahí se filtra con los chips de
             arriba. Se enciende en assets/css/tema-2026.css. -->
        <aside class="catalogo__filtros" data-filtros-panel aria-label="Filtros"></aside>

        <div class="catalogo__cuerpo">
          <div class="catalogo__barra">
            <p class="catalogo__cuenta" data-cuenta-productos aria-live="polite"></p>
            <label class="catalogo__orden">
              <span class="visualmente-oculto">Ordenar por</span>
              <select data-orden>
                <option value="destacados">Destacados</option>
                <option value="precio-asc">Precio: de menor a mayor</option>
                <option value="precio-desc">Precio: de mayor a menor</option>
                <option value="nombre">Nombre A-Z</option>
              </select>
            </label>
          </div>

          <div class="grilla grilla--productos" data-grilla-productos></div>
        </div>

      </div>
    </section>
  </main>

  <div id="chrome-bottom"></div>

  <!-- Precios de Odoo: los genera sync-odoo-precios.py. Va ANTES de data.js. -->
  <script src="assets/js/precios.js?v=47"></script>
  <script src="assets/js/data.js?v=47"></script>
  <!-- Trae el formato (polvo / cápsulas) que usa el filtro lateral -->
  <script src="assets/js/data-fichas.js?v=47"></script>
  <script src="assets/js/analitica.js?v=47"></script>
  <script src="assets/js/cart.js?v=47"></script>
  <script src="assets/js/components.js?v=47"></script>
  <script src="assets/js/main.js?v=47"></script>
  <script src="assets/js/popups.js?v=47"></script>
  <script src="assets/js/pages/productos.js?v=47"></script>

</body>
</html>

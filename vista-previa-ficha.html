<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Tokens de marca (copiados de styles.css solo para esta vista previa) */
:root{
  --color-primario:#EF7D2A; --color-primario-oscuro:#D2651A; --color-primario-texto:#A85410;
  --color-secundario:#0B55A3; --color-secundario-oscuro:#083F7A;
  --color-tinta:#16191D; --color-tinta-suave:#565C66;
  --color-linea:#E2E5EA; --color-fondo-suave:#F5F6F8;
  --radio:8px; --radio-lg:14px;
  --space-1:.25rem; --space-2:.5rem; --space-3:.75rem; --space-4:1rem;
  --space-5:1.5rem; --space-6:2rem; --space-7:3rem; --space-8:4rem;
  --fs-sm:.9375rem; --fs-md:1.125rem;
  --fuente-titulo:"Montserrat",system-ui,sans-serif;
  --fuente-texto:"Inter",system-ui,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;font-family:var(--fuente-texto);color:var(--color-tinta);background:#fff;line-height:1.6}
h1,h2,h3{font-family:var(--fuente-titulo);line-height:1.2;margin:0}
.contenedor{max-width:1200px;margin-inline:auto;padding-inline:var(--space-5)}
.aviso{background:var(--color-fondo-suave);border-bottom:1px solid var(--color-linea);padding:var(--space-4) 0;font-size:var(--fs-sm)}
.aviso__inner{display:flex;flex-wrap:wrap;gap:var(--space-4);align-items:center;justify-content:space-between}
.aviso select{font:inherit;padding:.5rem .75rem;border:1px solid var(--color-linea);border-radius:var(--radio);background:#fff;min-height:44px}
/* ============================================================================
   VITALICA — Ficha técnica de producto (acordeones + tablas)
   ----------------------------------------------------------------------------
   Hoja aparte para no tocar styles.css. Usa los tokens del sistema de diseño;
   los valores después de la coma son de respaldo por si el token cambia de
   nombre, así el bloque nunca queda sin estilo.
   ========================================================================== */

.ficha {
  padding-block: var(--space-7, 3rem);
}

.ficha__contenedor {
  max-width: 820px;
  margin-inline: auto;
}

.ficha__titulo {
  margin: 0 0 var(--space-4, 1rem);
}

/* --- Acordeón (usa <details>/<summary> nativos: accesible y sin JS) ------- */

.acordeon {
  border-bottom: 1px solid var(--color-linea, #E2E5EA);
}
.acordeon:first-of-type {
  border-top: 1px solid var(--color-linea, #E2E5EA);
}

.acordeon__cabecera {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-4, 1rem);
  padding: var(--space-4, 1rem) 0;
  min-height: 44px;                      /* objetivo táctil */
  cursor: pointer;
  font-family: var(--fuente-titulo, "Montserrat", sans-serif);
  font-weight: 700;
  font-size: 1.0625rem;
  color: var(--color-tinta, #16191D);
  list-style: none;                      /* saca el triangulito por defecto */
}
.acordeon__cabecera::-webkit-details-marker { display: none; }

.acordeon__cabecera:hover { color: var(--color-secundario, #0B55A3); }

.acordeon__cabecera:focus-visible {
  outline: 2px solid var(--color-secundario, #0B55A3);
  outline-offset: 3px;
  border-radius: var(--radio, 6px);
}

.acordeon__flecha {
  flex: none;
  color: var(--color-tinta-suave, #565C66);
  transition: transform .18s ease;
}
.acordeon[open] .acordeon__cabecera { color: var(--color-secundario, #0B55A3); }
.acordeon[open] .acordeon__flecha   { transform: rotate(180deg); }

.acordeon__cuerpo {
  padding-bottom: var(--space-5, 1.5rem);
}

@media (prefers-reduced-motion: reduce) {
  .acordeon__flecha { transition: none; }
}

/* --- Lista de especificaciones (dato / valor) ---------------------------- */

.ficha-specs {
  display: grid;
  grid-template-columns: minmax(9rem, 15rem) 1fr;
  margin: 0;
  font-size: var(--fs-sm, .9375rem);
}

.ficha-specs dt,
.ficha-specs dd {
  padding: .6rem 0;
  border-top: 1px solid var(--color-linea, #E2E5EA);
  margin: 0;
}
.ficha-specs dt:first-of-type,
.ficha-specs dt:first-of-type + dd { border-top: 0; }

.ficha-specs dt {
  font-weight: 600;
  color: var(--color-tinta-suave, #565C66);
  padding-right: var(--space-4, 1rem);
}
.ficha-specs dd {
  color: var(--color-tinta, #16191D);
}

/* En celular: dato arriba, valor abajo */
@media (max-width: 560px) {
  .ficha-specs { grid-template-columns: 1fr; }
  .ficha-specs dt { padding-bottom: 0; }
  .ficha-specs dd { padding-top: .15rem; border-top: 0; }
  .ficha-specs dt:first-of-type + dd { border-top: 0; }
}

/* --- Tabla nutricional --------------------------------------------------- */

.ficha-porcion {
  margin: 0 0 var(--space-3, .75rem);
  font-size: var(--fs-sm, .9375rem);
  color: var(--color-tinta-suave, #565C66);
}
.ficha-porcion strong { color: var(--color-tinta, #16191D); }

.ficha-tabla {
  width: 100%;
  border-collapse: collapse;
  font-size: var(--fs-sm, .9375rem);
}

.ficha-tabla th,
.ficha-tabla td {
  text-align: left;
  padding: .6rem .5rem;
  border-bottom: 1px solid var(--color-linea, #E2E5EA);
}
.ficha-tabla th:first-child,
.ficha-tabla td:first-child { padding-left: 0; }
.ficha-tabla th:not(:first-child),
.ficha-tabla td:not(:first-child) { text-align: right; white-space: nowrap; }

.ficha-tabla thead th {
  font-family: var(--fuente-titulo, "Montserrat", sans-serif);
  font-size: .8125rem;
  letter-spacing: .02em;
  color: var(--color-tinta-suave, #565C66);
  border-bottom-width: 2px;
}

.ficha-tabla tbody tr:last-child th,
.ficha-tabla tbody tr:last-child td { border-bottom: 0; }

.ficha-tabla td:first-child { color: var(--color-tinta, #16191D); }

/* Filas indentadas: en los datos, el nombre empieza con dos espacios
   (ej. "  de los cuales azúcares") y se muestra como sub-ítem. */
.ficha-tabla .es-subfila td:first-child {
  padding-left: 1.25rem;
  color: var(--color-tinta-suave, #565C66);
}

.ficha-nota {
  margin: var(--space-3, .75rem) 0 0;
  font-size: .8125rem;
  line-height: 1.5;
  color: var(--color-tinta-suave, #565C66);
}

/* --- Código de artículo -------------------------------------------------- */

.ficha-codigo {
  margin: var(--space-4, 1rem) 0 0;
  font-size: .8125rem;
  color: var(--color-tinta-suave, #565C66);
}
.ficha-codigo strong { font-weight: 600; }

</style>

<script>
// El contenido exacto de assets/js/pages/producto-ficha.js, envuelto en una
// función para poder repintarlo al cambiar de producto en el selector.
function renderFicha(){
/* ============================================================================
   VITALICA — Ficha técnica de producto
   ----------------------------------------------------------------------------
   Lee el ?id= de la URL, busca la ficha en VITALICA_FICHAS (data-fichas.js)
   y la dibuja dentro de <div data-ficha-tecnica></div>.

   Si el producto no tiene ficha cargada, no dibuja nada y avisa por consola
   qué id faltó. Nunca rompe la página.
   ========================================================================== */

(function () {
  'use strict';

  var contenedor = document.querySelector('[data-ficha-tecnica]');
  if (!contenedor) return;

  var fichas = window.VITALICA_FICHAS || {};

  // Normalmente el id sale del ?id= de la URL. La variable
  // VITALICA_FICHA_ID_FORZADO existe solo para la vista previa y para pruebas;
  // en el sitio no está definida, así que no cambia nada.
  var id = window.VITALICA_FICHA_ID_FORZADO ||
           new URLSearchParams(window.location.search).get('id');

  var ficha = id ? fichas[id] : null;

  if (!ficha) {
    if (id) {
      console.info(
        '[Ficha técnica] No hay ficha cargada para el id "' + id + '".\n' +
        'Ids disponibles en data-fichas.js: ' + Object.keys(fichas).join(', ')
      );
    }
    return;
  }

  /* --- utilidades ------------------------------------------------------- */

  // Escapa texto para que un valor con < o & no rompa el HTML.
  function esc(txt) {
    return String(txt == null ? '' : txt)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  var flecha =
    '<svg class="acordeon__flecha" viewBox="0 0 24 24" width="20" height="20" ' +
    'fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" ' +
    'stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>';

  // Arma un acordeón. `abierto` decide si arranca desplegado.
  function acordeon(titulo, cuerpoHTML, abierto) {
    return '' +
      '<details class="acordeon"' + (abierto ? ' open' : '') + '>' +
        '<summary class="acordeon__cabecera">' +
          '<span>' + esc(titulo) + '</span>' + flecha +
        '</summary>' +
        '<div class="acordeon__cuerpo">' + cuerpoHTML + '</div>' +
      '</details>';
  }

  /* --- bloque 1: especificaciones --------------------------------------- */

  function bloqueSpecs(specs) {
    if (!specs || !specs.length) return '';
    var filas = specs.map(function (par) {
      return '<dt>' + esc(par[0]) + '</dt><dd>' + esc(par[1]) + '</dd>';
    }).join('');
    return '<dl class="ficha-specs">' + filas + '</dl>';
  }

  /* --- bloque 2: información nutricional -------------------------------- */

  function bloqueNutricional(n) {
    if (!n || !n.filas || !n.filas.length) return '';

    var html = '';

    if (n.porcion) {
      html += '<p class="ficha-porcion">Porción: <strong>' +
              esc(n.porcion) + '</strong></p>';
    }

    var columnas = n.columnas || ['Cantidad'];

    html += '<table class="ficha-tabla"><thead><tr><th scope="col">Nutriente</th>';
    columnas.forEach(function (c) {
      html += '<th scope="col">' + esc(c) + '</th>';
    });
    html += '</tr></thead><tbody>';

    n.filas.forEach(function (fila) {
      // Los nombres que arrancan con espacios se muestran indentados.
      var esSub = /^\s{2,}/.test(fila[0]);
      html += '<tr' + (esSub ? ' class="es-subfila"' : '') + '>';
      html += '<td>' + esc(String(fila[0]).trim()) + '</td>';
      for (var i = 0; i < columnas.length; i++) {
        html += '<td>' + esc(fila[i + 1] || '—') + '</td>';
      }
      html += '</tr>';
    });

    html += '</tbody></table>';

    html += '<p class="ficha-nota">' +
            (n.nota ? esc(n.nota) + ' ' : '') +
            'Valores de referencia. La información que manda es la de la ' +
            'etiqueta del envase.</p>';

    return html;
  }

  /* --- armado final ------------------------------------------------------ */

  var partes = '';

  var specs = bloqueSpecs(ficha.specs);
  if (specs) partes += acordeon('Ficha técnica', specs, true);

  var nutri = bloqueNutricional(ficha.nutricional);
  if (nutri) partes += acordeon('Información nutricional', nutri, false);

  if (!partes) return;

  var codigo = ficha.codigo
    ? '<p class="ficha-codigo">Código de artículo: <strong>' +
      esc(ficha.codigo) + '</strong></p>'
    : '';

  contenedor.innerHTML =
    '<section class="ficha">' +
      '<div class="contenedor">' +
        '<div class="ficha__contenedor">' +
          '<h2 class="ficha__titulo">Detalle del producto</h2>' +
          partes +
          codigo +
        '</div>' +
      '</div>' +
    '</section>';

})();

}
</script>

<script>
(function(){
  var sel  = document.getElementById('selector');
  var cont = document.querySelector('[data-ficha-tecnica]');
  var ids  = Object.keys(window.VITALICA_FICHAS);

  ids.forEach(function(id){
    var o = document.createElement('option');
    o.value = id; o.textContent = id;
    sel.appendChild(o);
  });

  function pintar(id){
    window.VITALICA_FICHA_ID_FORZADO = id;
    cont.innerHTML = '';
    renderFicha();
  }

  sel.addEventListener('change', function(){ pintar(sel.value); });
  pintar(ids[0]);
})();
</script>

</body>

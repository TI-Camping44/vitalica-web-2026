# ============================================================================
# CREDENCIALES DE ODOO — plantilla
# ============================================================================
# CÓMO USAR:
#   1) Copiá este archivo y llamá a la copia  odoo-credenciales.ini
#   2) Completá los valores de abajo
#   3) NO subas odoo-credenciales.ini al hosting. Solo vive en la compu
#      donde corrés sync-odoo-precios.py
#
# Este archivo (el .ejemplo) sí se puede subir y compartir: no tiene datos.
# ============================================================================

[odoo]

# Dirección de tu Odoo, sin barra al final
url = https://camping44.odoo.com

# Nombre de la base. Suele coincidir con el subdominio.
# En Odoo se ve en Ajustes → Activar modo desarrollador → Información
db =

# El usuario con el que entrás a Odoo
usuario =

# Clave de API (NO es tu contraseña).
# Se genera en Odoo: click en tu nombre arriba a la derecha → Mi perfil
# → pestaña "Seguridad de la cuenta" → Claves API nuevas.
# Si alguna vez se filtra, se revoca desde ahí mismo y se genera otra.
api_key =

# Compañía dentro de Odoo de la que salen los precios (Vitalica = 2)
company_id = 2

# Lista de precios publicada
# En Odoo: Ventas → Productos → Listas de precios
pricelist = Público
